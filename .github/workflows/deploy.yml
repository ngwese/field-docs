# Build the documentation site and deploy it to GitHub Pages.
#
# The site publishes as a project site from this repository, so it is
# served under https://ngwese.github.io/field-docs/. `site` and `base` in
# astro.config.mjs match that.
#
# The scripting reference comes from the `field-assist` submodule, so the
# workflow initializes it and applies sparse-checkout before the sync and
# build. Nothing is published unless the check, build, and link gates all
# pass.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # `actions/checkout` fetches the pinned submodule commit. A shallow
      # update can miss a commit that is not a branch tip, so fall back to
      # a full fetch when the shallow one fails.
      - name: Check out the field-assist submodule
        run: |
          git submodule update --init --depth 1 vendor/field-assist || \
            git submodule update --init vendor/field-assist
          git -C vendor/field-assist sparse-checkout set \
            docs/scripting docs/spec docs/examples

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and content check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check links
        run: npm run check:links

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
